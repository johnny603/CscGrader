[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cscgrader"
version = "0.1.0"
description = "Language-agnostic build/execute evidence tool for CS grading workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cscgrader = "cscgrader_cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

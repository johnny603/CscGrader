[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cscgrader"
version = "0.1.0"
description = "Language-agnostic build/execute evidence tool for CS grading workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cscgrader = "cscgrader_cli:main"

[tool.setuptools]
py-modules = ["cscgrader_cli"]

[tool.setuptools.packages.find]
include = [
    "assignment*",
    "compilation*",
    "detection*",
    "execution*",
    "results*"
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"


[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["assignment", "compilation", "detection", "execution", "results"]
py-modules = ["cscgrader_cli"]
